<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>District 214 Intro to Business</title>
<meta name="description" content="Live class games and simulations for Intro to Business in High School District 214.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: sidebar menu + card grid hub, same structure as the District 214 Accounting site */
:root{
  --brown:#4C3629; --brown-2:#6B5040; --orange:#E26F39; --orange-lt:#F2955F;
  --paper:#F6F3F1; --card:#FFFFFF; --ink:#24190F; --muted:#6E6159; --line:#E2DAD4; --tint:#FBF1EB;
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Barlow','Segoe UI',Arial,sans-serif;
  --data:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --scale:1;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:calc(17px * var(--scale))}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--body);line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange-lt);outline-offset:2px}

/* top bar */
.top{background:var(--brown);color:#fff;border-bottom:5px solid var(--orange);position:sticky;top:0;z-index:20}
.top .in{display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo .mark{font-family:var(--display);font-weight:700;background:var(--orange);color:#fff;padding:3px 8px;border-radius:2px;font-size:1.05rem;letter-spacing:.02em}
.logo .nm{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:1.15rem}
.menuBtn{margin-left:auto;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.4);padding:6px 14px;border-radius:3px;cursor:pointer;font-size:.95rem}

/* layout */
.shell{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr)}
aside{background:var(--card);border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow:auto}
aside a{display:block;text-decoration:none;padding:6px 10px;border-radius:3px;font-size:.95rem}
aside a:hover{background:var(--tint)}
aside .home{font-weight:600;margin-bottom:10px}
aside h4{font-family:var(--data);text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;color:var(--orange);margin:16px 10px 4px}
aside .sub{font-family:var(--data);letter-spacing:.06em;text-transform:uppercase;font-size:.75rem;color:var(--muted);margin:8px 10px 2px}
main{padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;top:62px;left:0;bottom:0;width:min(300px,85vw);z-index:15;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15);max-height:none}
  body.menu-open aside{transform:none}
}
@media (min-width:861px){.menuBtn{display:none}}

/* hero */
.eyebrow{font-family:var(--data);text-transform:uppercase;letter-spacing:.14em;color:var(--orange);font-weight:600;font-size:.85rem}
h1{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--brown);font-size:clamp(2rem,4.6vw,3rem);line-height:1.05;margin:4px 0 10px;text-wrap:balance}
.lede{font-size:1.1rem;max-width:62ch;margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font-family:var(--data);text-transform:uppercase;letter-spacing:.08em;font-size:.9rem;font-weight:600;background:var(--card);color:var(--brown);border:1.5px solid var(--line);padding:6px 14px;border-radius:20px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--brown);color:#fff;border-color:var(--brown)}

/* sections + cards */
section{display:flex;flex-direction:column;gap:12px;scroll-margin-top:80px}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-bottom:2px solid var(--line);padding-bottom:6px}
.sh h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--brown);font-size:1.5rem;margin:0}
.sh p{margin:0;color:var(--muted);font-size:.95rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--brown);border-radius:4px;padding:16px 18px;text-decoration:none;transition:transform .12s,box-shadow .12s;min-width:0}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(76,54,41,.12)}
.card.live{border-top-color:var(--orange)}
.card .tags{display:flex;gap:8px;align-items:center}
.card .tag{white-space:nowrap;font-family:var(--data);font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;background:var(--tint);color:var(--brown);padding:2px 8px;border-radius:2px}
.card .topic{font-family:var(--data);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--brown);font-size:1.3rem;margin:2px 0 0}
.card p{margin:0;font-size:.97rem}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;font-family:var(--data);font-size:.9rem}
.card .count{color:var(--muted);letter-spacing:.04em}
.card .go{font-weight:600;color:var(--orange);letter-spacing:.06em;text-transform:uppercase}
.card.soon{border-style:dashed;border-top-style:solid;border-top-color:var(--line);opacity:.75;pointer-events:none}
.empty{color:var(--muted);margin:0}

/* footer */
footer{border-top:1px solid var(--line);background:var(--card);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted)}
.size{display:flex;align-items:center;gap:6px}
.size button{font-family:var(--data);font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:3px 10px;cursor:pointer;color:var(--brown)}
.size output{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.card,aside{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <a class="logo" href="/"><span class="mark">214</span><span class="nm">Intro to Business</span></a>
    <button class="menuBtn" id="menuBtn" aria-expanded="false" aria-controls="side">Menu</button>
  </div>
</header>

<div class="shell">
  <aside id="side" aria-label="Menu">
    <a class="home" href="/">Home</a>
    <div id="sideNav"></div>
  </aside>

  <main>
    <div class="wrap">
      <div>
        <span class="eyebrow">High School District 214</span>
        <h1>Intro to Business games and simulations</h1>
        <p class="lede">Live class games your teacher runs on the board, and simulations you can play on your own and send to your teacher as a report.</p>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Filter by unit"></div>
      <div id="sections" class="wrap" style="gap:30px"></div>
    </div>
  </main>
</div>

<footer>
  <span>High School District 214 | Intro to Business</span>
  <span class="size" aria-label="Text size">
    <button id="smaller" aria-label="Smaller text">A&minus;</button>
    <output id="pct">100%</output>
    <button id="bigger" aria-label="Larger text">A+</button>
  </span>
</footer>

<script>
// ===== Everything on the hub comes from this list. Add a game by adding an item. =====
const SECTIONS = [
  { id: "live", title: "Live Class Games", note: "Teacher-led. Pick “Live in Class” and join with your first names." },
  { id: "sims", title: "Simulations", note: "Play on your own with “Open Play,” then send your report to your teacher." }
];
const ITEMS = [
  { section: "live", unit: "Unit 3", topic: "Brand crisis simulation", title: "Brand Crisis", href: "/brand-crisis/",
    text: "You run Strider Sneakers when a crisis hits. Pick one of 8 responses before time runs out, then see what happened next. Protect your trust, watch your budget, and grow your brand value.", count: "Join with a code", go: "Join" },
  { section: "live", unit: "Unit 3", topic: "Unit review · Tables of 3", title: "Marketing Ladder", href: "/marketing-ladder/",
    text: "Whole-unit review: target marketing, emotional marketing, the media buy, ad channels, social ads, and segmentation. Join with your first name, play the two people at your table, and move up when you win.", count: "Join with a code", go: "Join" },
  { section: "live", unit: "Unit 3", topic: "Target marketing", title: "Media Buy Live", href: "/media-buy/",
    text: "Your teacher runs one company on the board. Split $1,000,000 across customer segments each year and see who spent it best.", count: "Up to 15 teams", go: "Join" },
  { section: "live", unit: "Unit 3", topic: "Advertising channels", title: "Windy City Live", href: "/windy-city/",
    text: "Your teacher runs one company on the board. Spend $1,000,000 on Chicago ad channels and compare returns as a class.", count: "Up to 15 teams", go: "Join" },
  { section: "live", unit: "Unit 3", topic: "Market segmentation", title: "Build the Lineup Live", href: "/build-the-lineup/",
    text: "Your teacher runs one company on the board. Build a version for each customer segment, price it, and see whose lineup makes the most profit.", count: "Up to 15 teams", go: "Join" },
  { section: "live", unit: "Unit 3", topic: "Social media marketing", title: "Ad Buy Showdown Live", href: "/ad-buy-showdown/",
    text: "Six clients, from Calvin Harris tickets to a Black Friday headset. Pick platforms, audiences, and creative, lock in your buy, and see whose campaign made the most profit.", count: "Up to 15 teams · 6 rounds", go: "Join" },
  { section: "live", unit: "Unit 3", topic: "Social media marketing · Review", title: "Ad Buy Live", href: "/ad-buy-live/",
    text: "Kahoot-style review on your own device: ad terms, the math, who's scrolling where, targeting, formats, and campaign calls. Speed earns points, wrong answers cost points.", count: "6 rounds · join with a code", go: "Join" },
  { section: "sims", unit: "Unit 3", topic: "Target marketing", title: "Million Dollar Media Buy", href: "/media-buy/",
    text: "Read the client brief, find the customers who actually spend, and put your money there. Five companies, four years each.", count: "5 companies", go: "Play" },
  { section: "sims", unit: "Unit 3", topic: "Advertising channels · ROI", title: "Windy City Ad Buy", href: "/windy-city/",
    text: "Instagram, TikTok, the CTA, the United Center, or Lollapalooza? Match each company’s customers to the Chicago channels they use and find the best ROI.", count: "5 companies · 9 channels", go: "Play" },
  { section: "sims", unit: "Unit 3", topic: "Market segmentation · Pricing", title: "Build the Lineup", href: "/build-the-lineup/",
    text: "One product, three kinds of customers. Pick the features and the price for each version, launch it, then fix it for Launch 2.", count: "12 companies", go: "Play" },
  { section: "sims", unit: "Unit 3", topic: "Social media marketing · ROAS", title: "Ad Buy Showdown", href: "/ad-buy-showdown/",
    text: "Build a real social ad buy for six clients: objective, location, ages, interests, format, and budget across Instagram, TikTok, Snapchat, and more.", count: "6 clients · 6 platforms", go: "Play" }
];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const units = [...new Set(ITEMS.map(i => i.unit))].sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
let filter = "all";

function render() {
  $("#filters").innerHTML = ["all", ...units].map(u => `<button aria-pressed="${filter === u}" data-f="${esc(u)}">${u === "all" ? "All units" : esc(u)}</button>`).join("");
  $("#sections").innerHTML = SECTIONS.map(sec => {
    const list = ITEMS.filter(i => i.section === sec.id && (filter === "all" || i.unit === filter));
    return `<section id="${sec.id}"><div class="sh"><h2>${esc(sec.title)}</h2><p>${esc(sec.note)}</p></div>
      ${list.length ? `<div class="cards">${list.map(card).join("")}</div>` : `<p class="empty">Nothing here for this unit yet.</p>`}</section>`;
  }).join("");
  $("#sideNav").innerHTML = SECTIONS.map(sec => `<h4>${esc(sec.title)}</h4>` + units.map(u => {
    const list = ITEMS.filter(i => i.section === sec.id && i.unit === u);
    return list.length ? `<div class="sub">${esc(u)}</div>` + list.map(i => `<a href="${i.href}">${esc(i.title)}</a>`).join("") : "";
  }).join("")).join("");
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
}
const card = i => `<a class="card ${i.section === "live" ? "live" : ""}" href="${i.href}">
  <div class="tags"><span class="tag">${esc(i.unit)}</span><span class="topic">${esc(i.topic)}</span></div>
  <h3>${esc(i.title)}</h3><p>${esc(i.text)}</p>
  <div class="foot"><span class="count">${esc(i.count)}</span><span class="go">${esc(i.go)} →</span></div></a>`;

// mobile menu
$("#menuBtn").onclick = () => { const open = document.body.classList.toggle("menu-open"); $("#menuBtn").setAttribute("aria-expanded", open); };
$("#side").addEventListener("click", e => { if (e.target.tagName === "A") document.body.classList.remove("menu-open"); });

// text size, remembered on this device
let scale = 1;
try { scale = parseFloat(localStorage.getItem("ib214-scale")) || 1; } catch {}
function setScale(v) {
  scale = Math.min(1.5, Math.max(0.8, Math.round(v * 10) / 10));
  document.documentElement.style.setProperty("--scale", scale);
  $("#pct").textContent = Math.round(scale * 100) + "%";
  try { localStorage.setItem("ib214-scale", scale); } catch {}
}
$("#smaller").onclick = () => setScale(scale - 0.1);
$("#bigger").onclick = () => setScale(scale + 0.1);
setScale(scale);
render();
</script>
</body>
</html>
