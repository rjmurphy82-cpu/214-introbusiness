<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Build the Lineup Teacher Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap">
<link rel="stylesheet" href="/build-the-lineup/css/style.css">
</head>
<body>
<header class="mast">
  <div class="wrap">
    <a class="brand" href="/" style="color:inherit;text-decoration:none"><small>Teacher Console &middot; Market Segmentation</small><h1>Build the <span>Lineup</span></h1></a>
    <div class="yearbar" id="yearbar" aria-label="Launch progress"></div>
    <nav class="tabs" id="tabs" aria-label="Views" hidden>
      <button data-view="control">Control</button>
      <button data-view="brief">Case File</button>
      <button data-view="standings">Standings</button>
      <button data-view="games">Games</button>
    </nav>
    <div class="who" id="who" hidden></div>
  </div>
</header>
<main class="wrap" id="app"><p class="muted">Loading&hellip;</p></main>
<script type="module" src="/build-the-lineup/js/teacher.js"></script>

</html>
